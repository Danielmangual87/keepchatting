[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-sweep-fvg"
version = "0.1.0"
description = "XAUUSD sweep -> 1-minute FVG reversal alert system"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dashboard = ["flask>=3.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
